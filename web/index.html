<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>harbor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>
    <div id="build-form" class="overlay" hidden>
      <form class="panel" autocomplete="off">
        <h2>WAR FACTORY <span class="where"></span></h2>
        <label>NAMESPACE <select name="ns"></select></label>
        <label>NAME <input name="name" required maxlength="63" pattern="[a-z0-9]([-a-z0-9]*[a-z0-9])?" placeholder="lowercase, dashes" /></label>
        <label>IMAGE <input name="image" required value="nginx:1.27-alpine" /></label>
        <div class="row">
          <label>UNITS <input name="replicas" type="number" min="0" max="500" value="1" /></label>
          <label>PORT <input name="port" type="number" min="1" max="65535" placeholder="none" /></label>
        </div>
        <div class="row">
          <label>CPU/UNIT <input name="cpu" value="50m" /></label>
          <label>MEM/UNIT <input name="mem" value="64Mi" /></label>
        </div>
        <p class="err" hidden></p>
        <div class="actions">
          <button type="submit">BUILD</button>
          <button type="button" data-cancel>CANCEL</button>
        </div>
      </form>
    </div>
    <div id="search" class="overlay top" hidden>
      <div class="panel">
        <h2>LOCATE <span class="where">Enter selects, Esc closes</span></h2>
        <input type="text" placeholder="structure or unit name" autocomplete="off" />
        <ul class="results"></ul>
      </div>
    </div>
    <div id="filter" class="overlay" hidden>
      <div class="panel">
        <h2>RADAR FILTER <span class="where">which namespaces to show</span></h2>
        <label class="inline"><input type="checkbox" name="system" /> show system namespaces</label>
        <div class="list"></div>
        <div class="actions">
          <button type="button" data-all>SHOW ALL</button>
          <button type="button" data-close>CLOSE</button>
        </div>
      </div>
    </div>
    <div id="tech" class="overlay" hidden>
      <div class="panel wide">
        <h2>TECH TREE <span class="where">helm</span></h2>
        <div class="tabs">
          <button type="button" data-tab="charts">CHARTS</button>
          <button type="button" data-tab="repos">REPOS</button>
          <button type="button" data-tab="releases">EXPANSIONS</button>
        </div>
        <div data-pane="charts" hidden>
          <input type="text" name="q" placeholder="search charts (empty = all)" autocomplete="off" />
          <div class="rows"></div>
        </div>
        <div data-pane="repos" hidden>
          <div class="rows"></div>
          <div class="row add">
            <input type="text" name="rname" placeholder="name" autocomplete="off" />
            <input type="text" name="rurl" placeholder="https://charts.example.com" autocomplete="off" />
            <button type="button" data-add>ADD</button>
            <button type="button" data-update>UPDATE ALL</button>
          </div>
        </div>
        <div data-pane="releases" hidden>
          <div class="rows"></div>
        </div>
        <div data-pane="form" hidden>
          <h3></h3>
          <form autocomplete="off">
            <div class="row">
              <label>CHART <input name="chart" /></label>
              <label>VERSION <input name="version" placeholder="latest" /></label>
            </div>
            <div class="row">
              <label>RELEASE NAME <input name="name" required maxlength="53" pattern="[a-z0-9]([-a-z0-9]*[a-z0-9])?" /></label>
              <label>NAMESPACE <select name="ns"></select></label>
            </div>
            <label>VALUES (yaml) <textarea name="values" rows="10" spellcheck="false"></textarea></label>
            <div class="actions">
              <button type="submit">DEPLOY</button>
              <button type="button" data-back>BACK</button>
            </div>
          </form>
        </div>
        <p class="err" hidden></p>
        <div class="actions">
          <button type="button" data-close>CLOSE</button>
        </div>
      </div>
    </div>
    <div id="logs" class="overlay" hidden>
      <div class="panel wide">
        <h2>UNIT INTEL <span class="where"></span></h2>
        <div class="row add">
          <select name="container"></select>
          <label class="inline"><input type="checkbox" name="follow" checked /> follow</label>
          <button type="button" data-refresh>REFRESH</button>
          <button type="button" data-close>CLOSE</button>
        </div>
        <pre class="log"></pre>
      </div>
    </div>
    <div id="mission" class="overlay" hidden>
      <div class="panel wide">
        <h2>SELECT THEATER <span class="where">kubeconfig contexts</span></h2>
        <div class="rows"></div>
        <p class="err" hidden></p>
        <div class="actions"><button type="button" data-close>CLOSE</button></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
