<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>harbor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>
    <div id="build-form" class="overlay" hidden>
      <form class="panel" autocomplete="off">
        <h2>WAR FACTORY <span class="where"></span></h2>
        <label>NAMESPACE <select name="ns"></select></label>
        <label>NAME <input name="name" required maxlength="63" pattern="[a-z0-9]([-a-z0-9]*[a-z0-9])?" placeholder="lowercase, dashes" /></label>
        <label>IMAGE <input name="image" required value="nginx:1.27-alpine" /></label>
        <div class="row">
          <label>UNITS <input name="replicas" type="number" min="0" max="500" value="1" /></label>
          <label>PORT <input name="port" type="number" min="1" max="65535" placeholder="none" /></label>
        </div>
        <div class="row">
          <label>CPU/UNIT <input name="cpu" value="50m" /></label>
          <label>MEM/UNIT <input name="mem" value="64Mi" /></label>
        </div>
        <p class="err" hidden></p>
        <div class="actions">
          <button type="submit">BUILD</button>
          <button type="button" data-cancel>CANCEL</button>
        </div>
      </form>
    </div>
    <div id="search" class="overlay top" hidden>
      <div class="panel">
        <h2>LOCATE <span class="where">Enter selects, Esc closes</span></h2>
        <input type="text" placeholder="structure or unit name" autocomplete="off" />
        <ul class="results"></ul>
      </div>
    </div>
    <div id="filter" class="overlay" hidden>
      <div class="panel">
        <h2>RADAR FILTER <span class="where">which namespaces to show</span></h2>
        <label class="inline"><input type="checkbox" name="system" /> show system namespaces</label>
        <div class="list"></div>
        <div class="actions">
          <button type="button" data-all>SHOW ALL</button>
          <button type="button" data-close>CLOSE</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
