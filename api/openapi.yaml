openapi: 3.0.3
info:
  title: harbor API
  version: 0.1.0
  description: >
    Local API between the harbor Phaser frontend and the Go backend. Wire models
    are lean summaries of Kubernetes objects, not raw Kubernetes JSON. The
    WebSocket event stream at /ws carries WsMessage objects; it is not an HTTP
    path and so is described only under components.
servers:
  - url: http://127.0.0.1:8080

paths:
  /api/healthz:
    get:
      operationId: getHealth
      summary: Liveness and build info
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/contexts:
    get:
      operationId: listContexts
      summary: List kubeconfig contexts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextList"
        default:
          $ref: "#/components/responses/Error"

  /api/contexts/{name}/select:
    post:
      operationId: selectContext
      summary: Select a context and start watching it
      parameters:
        - $ref: "#/components/parameters/ContextNameParam"
      responses:
        "204":
          description: Context selected
        default:
          $ref: "#/components/responses/Error"

  /api/snapshot:
    get:
      operationId: getSnapshot
      summary: Full cluster state for a fresh client
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        default:
          $ref: "#/components/responses/Error"

  /api/deployments:
    post:
      operationId: createDeployment
      summary: Create a Deployment (place a War Factory)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeploymentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        default:
          $ref: "#/components/responses/Error"

  /api/deployments/{ns}/{name}:
    delete:
      operationId: deleteDeployment
      summary: Sell a structure (delete the Deployment; its pods follow)
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"

  /api/workloads/statefulsets:
    post:
      operationId: createStatefulSet
      summary: Build a tanker terminal (StatefulSet plus its headless Service)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStatefulSetRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
        default:
          $ref: "#/components/responses/Error"

  /api/workloads/jobs:
    post:
      operationId: createJob
      summary: Send out a fishing fleet (create a Job)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workload"
        default:
          $ref: "#/components/responses/Error"

  /api/services:
    post:
      operationId: createService
      summary: Light a lighthouse (create a Service)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        default:
          $ref: "#/components/responses/Error"

  /api/services/{ns}/{name}:
    delete:
      operationId: deleteService
      summary: Put out a lighthouse (delete the Service)
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: patchServiceSelector
      summary: Re-aim a lighthouse (replace the Service's selector)
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectorPatch"
      responses:
        "204":
          description: Patched
        default:
          $ref: "#/components/responses/Error"

  /api/ingresses:
    post:
      operationId: createIngress
      summary: Open a gate (create an Ingress)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIngressRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingress"
        default:
          $ref: "#/components/responses/Error"

  /api/workloads/{kind}/{ns}/{name}:
    delete:
      operationId: deleteWorkload
      summary: Delete a StatefulSet, DaemonSet or Job (and its pods)
      parameters:
        - $ref: "#/components/parameters/WorkloadKindParam"
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"

  /api/workloads/{kind}/{ns}/{name}/scale:
    patch:
      operationId: scaleWorkload
      summary: Set replicas on a StatefulSet (other kinds cannot be scaled)
      parameters:
        - $ref: "#/components/parameters/WorkloadKindParam"
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScaleRequest"
      responses:
        "204":
          description: Scaled
        default:
          $ref: "#/components/responses/Error"

  /api/workloads/{kind}/{ns}/{name}/mappos:
    patch:
      operationId: setWorkloadMapPos
      summary: Persist a workload structure's map tile as an annotation
      parameters:
        - $ref: "#/components/parameters/WorkloadKindParam"
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapPos"
      responses:
        "204":
          description: Stored
        default:
          $ref: "#/components/responses/Error"

  /api/ingresses/{ns}/{name}:
    delete:
      operationId: deleteIngress
      summary: Close a gate (delete the Ingress)
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"

  /api/pods/{ns}/{name}/logs:
    get:
      operationId: getPodLogs
      summary: Recent log lines of a pod's container (default container if unspecified)
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
        - name: container
          in: query
          required: false
          schema:
            type: string
        - name: tail
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
          description: Lines from the end; default 200.
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  /api/pods/{ns}/{name}:
    delete:
      operationId: deletePod
      summary: Repair a unit (delete the pod so its ReplicaSet replaces it)
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"

  /api/deployments/{ns}/{name}/refit:
    patch:
      operationId: refitDeployment
      summary: Refit a shipyard (new image and rollout strategy)
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefitRequest"
      responses:
        "204":
          description: Rollout started
        default:
          $ref: "#/components/responses/Error"

  /api/deployments/{ns}/{name}/rollback:
    post:
      operationId: rollbackDeployment
      summary: Roll back a shipyard to its previous refit (rollout undo)
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      responses:
        "204":
          description: Rolled back
        default:
          $ref: "#/components/responses/Error"

  /api/namespaces:
    post:
      operationId: createNamespace
      summary: Found a fleet (create a Namespace)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNamespaceRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Namespace"
        default:
          $ref: "#/components/responses/Error"

  /api/deployments/{ns}/{name}/scale:
    patch:
      operationId: scaleDeployment
      summary: Set replica count (build or sell units)
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScaleRequest"
      responses:
        "204":
          description: Scaled
        default:
          $ref: "#/components/responses/Error"

  /api/deployments/{ns}/{name}/mappos:
    patch:
      operationId: setDeploymentMapPos
      summary: Persist the building's map tile as an annotation
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapPos"
      responses:
        "204":
          description: Stored
        default:
          $ref: "#/components/responses/Error"

  /api/orders:
    get:
      operationId: listOrders
      summary: Sealed orders (ConfigMaps and Secrets) in a namespace, keys only
      parameters:
        - name: ns
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Orders"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createOrders
      summary: Write sealed orders (create a ConfigMap or Secret)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrdersRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Orders"
        default:
          $ref: "#/components/responses/Error"

  /api/orders/{kind}/{ns}/{name}:
    delete:
      operationId: deleteOrders
      summary: Burn sealed orders (delete the ConfigMap or Secret)
      parameters:
        - $ref: "#/components/parameters/OrdersKindParam"
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"

  /api/objects/{kind}/{ns}/{name}:
    get:
      operationId: getObject
      summary: An object's papers, spec (what you asked for) and status (what the cluster reports), as YAML
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [Deployment, Pod, Service, Ingress, StatefulSet, DaemonSet, Job, ConfigMap, Namespace]
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectPapers"
        default:
          $ref: "#/components/responses/Error"

  /api/apply:
    post:
      operationId: applyManifest
      summary: Server-side apply of one or more manifests (whitelisted kinds); dryRun reports what would change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyRequest"
      responses:
        "200":
          description: Applied (or dry-run)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyResult"
        default:
          $ref: "#/components/responses/Error"

  /api/pods/{ns}/{name}/labels:
    patch:
      operationId: patchPodLabels
      summary: Change a ship's ensign (set or remove pod labels)
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelPatch"
      responses:
        "204":
          description: Patched
        default:
          $ref: "#/components/responses/Error"

  /api/deployments/{ns}/{name}/labels:
    patch:
      operationId: patchDeploymentLabels
      summary: Change the ensign a shipyard paints on new ships (pod template labels; selector labels cannot be removed)
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelPatch"
      responses:
        "204":
          description: Patched
        default:
          $ref: "#/components/responses/Error"

  /api/campaigns:
    get:
      operationId: listCampaigns
      summary: Expeditions (vendor campaigns) built in and from ~/.config/harbor/campaigns
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
        default:
          $ref: "#/components/responses/Error"

  /api/campaigns/probe:
    post:
      operationId: runProbe
      summary: Run one whitelisted check against the connected cluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeRequest"
      responses:
        "200":
          description: Probe ran (ok says whether it passed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResult"
        default:
          $ref: "#/components/responses/Error"

  /api/stage/{incident}:
    post:
      operationId: stageIncident
      summary: Stage a known incident on the connected cluster (academy real-cluster replays)
      description: >
        A fixed whitelist of things the academy may do to a real cluster, all
        inside namespaces labelled harbor.dev/academy=true so cleanup can find them.
      parameters:
        - name: incident
          in: path
          required: true
          schema:
            type: string
            enum: [found, lone-ship, sink-pod, bad-refit, drain, uncordon, quota, cleanup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageRequest"
      responses:
        "202":
          description: Staged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageResult"
        default:
          $ref: "#/components/responses/Error"

  /api/progress:
    get:
      operationId: getProgress
      summary: Harbor Academy progress for this machine
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: resetProgress
      summary: Forget all Harbor Academy progress (start the logbook afresh)
      responses:
        "204":
          description: Reset
        default:
          $ref: "#/components/responses/Error"

  /api/progress/{level}:
    put:
      operationId: putLevelProgress
      summary: Record a level result (best values are kept)
      parameters:
        - name: level
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LevelProgress"
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        default:
          $ref: "#/components/responses/Error"

  /api/helm/repos:
    get:
      operationId: listHelmRepos
      summary: Chart repositories known to this machine (tech tree sources)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelmRepo"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addHelmRepo
      summary: Add a chart repository and fetch its index
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelmRepo"
      responses:
        "204":
          description: Added
        default:
          $ref: "#/components/responses/Error"

  /api/helm/repos/update:
    post:
      operationId: updateHelmRepos
      summary: Refresh every repository index
      responses:
        "204":
          description: Updated
        default:
          $ref: "#/components/responses/Error"

  /api/helm/charts:
    get:
      operationId: searchHelmCharts
      summary: Charts matching a query across cached repository indexes
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelmChart"
        default:
          $ref: "#/components/responses/Error"

  /api/helm/charts/values:
    get:
      operationId: getHelmChartValues
      summary: Default values.yaml of a chart
      parameters:
        - name: chart
          in: query
          required: true
          schema:
            type: string
          description: repo/name
        - name: version
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelmValues"
        default:
          $ref: "#/components/responses/Error"

  /api/helm/releases:
    get:
      operationId: listHelmReleases
      summary: Releases across all namespaces
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelmRelease"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: installHelmRelease
      summary: Install a chart (build a base expansion)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelmInstallRequest"
      responses:
        "201":
          description: Installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelmRelease"
        default:
          $ref: "#/components/responses/Error"

  /api/helm/releases/{ns}/{name}:
    delete:
      operationId: uninstallHelmRelease
      summary: Uninstall a release
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      responses:
        "204":
          description: Uninstalled
        default:
          $ref: "#/components/responses/Error"

  /api/helm/releases/{ns}/{name}/history:
    get:
      operationId: getHelmReleaseHistory
      summary: Revisions of a release, newest last
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelmRevision"
        default:
          $ref: "#/components/responses/Error"

  /api/helm/releases/{ns}/{name}/upgrade:
    post:
      operationId: upgradeHelmRelease
      summary: Upgrade a release (new chart version and/or values)
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelmUpgradeRequest"
      responses:
        "200":
          description: Upgraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelmRelease"
        default:
          $ref: "#/components/responses/Error"

  /api/helm/releases/{ns}/{name}/rollback:
    post:
      operationId: rollbackHelmRelease
      summary: Roll a release back to a revision
      parameters:
        - $ref: "#/components/parameters/NamespaceParam"
        - $ref: "#/components/parameters/NameParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelmRollbackRequest"
      responses:
        "204":
          description: Rolled back
        default:
          $ref: "#/components/responses/Error"

components:
  parameters:
    WorkloadKindParam:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [StatefulSet, DaemonSet, Job]
    OrdersKindParam:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [ConfigMap, Secret]
    ContextNameParam:
      name: name
      in: path
      required: true
      schema:
        type: string
    NamespaceParam:
      name: ns
      in: path
      required: true
      schema:
        type: string
    NameParam:
      name: name
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Health:
      type: object
      required: [status, version, uptimeSeconds]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        uptimeSeconds:
          type: integer

    ContextList:
      type: object
      required: [contexts, current]
      properties:
        contexts:
          type: array
          items:
            $ref: "#/components/schemas/KubeContext"
        current:
          type: string
          description: Name of the context the backend is watching, empty if none.

    KubeContext:
      type: object
      required: [name, cluster, user]
      properties:
        name:
          type: string
        cluster:
          type: string
        user:
          type: string
        namespace:
          type: string

    MapPos:
      type: object
      description: Tile coordinates on the map grid.
      required: [x, y]
      properties:
        x:
          type: integer
        y:
          type: integer

    Node:
      type: object
      required: [name, ready, cpuAlloc, memAlloc, cpuReq, memReq, labels]
      properties:
        name:
          type: string
        ready:
          type: boolean
        cpuAlloc:
          type: integer
          description: Allocatable CPU in millicores.
        memAlloc:
          type: integer
          format: int64
          description: Allocatable memory in bytes.
        cpuReq:
          type: integer
          description: Sum of pod CPU requests in millicores.
        memReq:
          type: integer
          format: int64
          description: Sum of pod memory requests in bytes.
        labels:
          type: object
          additionalProperties:
            type: string

    Namespace:
      type: object
      required: [name, phase]
      properties:
        name:
          type: string
        phase:
          type: string

    Condition:
      type: object
      required: [type, status]
      properties:
        type:
          type: string
        status:
          type: string
        reason:
          type: string
        message:
          type: string

    Deployment:
      type: object
      required: [ns, name, replicas, available, updated, image, conditions]
      properties:
        ns:
          type: string
        name:
          type: string
        replicas:
          type: integer
        available:
          type: integer
        updated:
          type: integer
        image:
          type: string
          description: Image of the first container.
        currentRS:
          type: string
          description: >
            ReplicaSet for the current pod template. Pods whose ownerRS differs
            belong to an old rollout and are being replaced.
        release:
          type: string
          description: Helm release that owns this Deployment (meta.helm.sh/release-name), if any.
        managers:
          type: array
          description: Field managers that wrote this object, most recent last.
          items:
            type: string
        templateLabels:
          type: object
          description: Labels the pod template carries (the ensign painted on new ships).
          additionalProperties:
            type: string
        gracePeriod:
          type: integer
          description: terminationGracePeriodSeconds of the pod template.
        strategy:
          type: string
          description: Rollout strategy, summarised ("RollingUpdate maxUnavailable=25% maxSurge=25%" or "Recreate").
        revision:
          type: integer
          description: Current rollout revision (deployment.kubernetes.io/revision), if known.
        requests:
          type: string
          description: Resource requests of the first container, summarised (e.g. "cpu 50m · mem 64Mi"), if any.
        limits:
          type: string
          description: Resource limits of the first container, summarised, if any.
        orders:
          type: array
          description: ConfigMaps and Secrets the pod template reads (envFrom, env valueFrom, volumes), as "Kind/name".
          items:
            type: string
        readiness:
          type: string
          description: Readiness probe of the first container, summarised (e.g. "http /healthz"), if any.
        liveness:
          type: string
          description: Liveness probe of the first container, summarised, if any.
        mapPos:
          $ref: "#/components/schemas/MapPos"
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/Condition"

    Pod:
      type: object
      required: [ns, name, node, phase, ready, restarts, created, labels, containers]
      properties:
        ns:
          type: string
        name:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        containers:
          type: array
          items:
            type: string
        node:
          type: string
          description: Scheduled node name, empty while Pending.
        phase:
          type: string
        ready:
          type: boolean
        restarts:
          type: integer
        reason:
          type: string
          description: Waiting or terminated reason of the worst container, e.g. CrashLoopBackOff.
        ownerKind:
          type: string
          description: Controller kind that owns the pod (Deployment, StatefulSet, DaemonSet, Job, ReplicaSet, Node, ...), if any.
        ownerName:
          type: string
        ownerRS:
          type: string
        managers:
          type: array
          description: Field managers that wrote this pod, most recent last (kubelet, scheduler, controllers, you).
          items:
            type: string
        deployment:
          type: string
          description: Owning Deployment name resolved through the ReplicaSet.
        created:
          type: string
          format: date-time

    Workload:
      type: object
      description: A StatefulSet (tanker terminal), DaemonSet (tug company) or Job (fishing fleet).
      required: [kind, ns, name, image, desired, ready, conditions]
      properties:
        kind:
          type: string
          enum: [StatefulSet, DaemonSet, Job]
        ns:
          type: string
        name:
          type: string
        image:
          type: string
        desired:
          type: integer
          description: StatefulSet replicas, DaemonSet desiredNumberScheduled, Job completions (or parallelism).
        ready:
          type: integer
          description: StatefulSet readyReplicas, DaemonSet numberReady, Job succeeded.
        active:
          type: integer
          description: Job pods still running.
        failed:
          type: integer
          description: Job pods that failed.
        complete:
          type: boolean
          description: Job finished (Complete or Failed condition).
        mapPos:
          $ref: "#/components/schemas/MapPos"
        release:
          type: string
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/Condition"

    IngressRule:
      type: object
      required: [host, path, service, port]
      properties:
        host:
          type: string
        path:
          type: string
        service:
          type: string
        port:
          type: string
          description: Port number or name on the backend Service.

    Ingress:
      type: object
      description: "The harbor mouth: a gate that channels outside traffic to lighthouses (Services)."
      required: [ns, name, hosts, rules, tls, addresses]
      properties:
        ns:
          type: string
        name:
          type: string
        class:
          type: string
        hosts:
          type: array
          items:
            type: string
        rules:
          type: array
          items:
            $ref: "#/components/schemas/IngressRule"
        tls:
          type: boolean
        addresses:
          type: array
          items:
            type: string
          description: Load balancer IPs or hostnames once assigned.

    ServicePort:
      type: object
      required: [port, targetPort, protocol]
      properties:
        port:
          type: integer
        targetPort:
          type: string
        protocol:
          type: string
        name:
          type: string

    Service:
      type: object
      description: A radar structure; its selector links it to the units it routes to.
      required: [ns, name, type, clusterIP, ports, selector]
      properties:
        ns:
          type: string
        name:
          type: string
        type:
          type: string
          description: ClusterIP, NodePort, LoadBalancer or ExternalName.
        clusterIP:
          type: string
        ports:
          type: array
          items:
            $ref: "#/components/schemas/ServicePort"
        selector:
          type: object
          additionalProperties:
            type: string

    Event:
      type: object
      required: [ns, kind, name, type, reason, message, ts]
      properties:
        ns:
          type: string
        kind:
          type: string
        name:
          type: string
        type:
          type: string
          description: Normal or Warning.
        reason:
          type: string
        message:
          type: string
        ts:
          type: string
          format: date-time

    Snapshot:
      type: object
      required: [context, nodes, namespaces, deployments, pods, releases, services, workloads, ingresses]
      properties:
        context:
          type: string
        ingresses:
          type: array
          items:
            $ref: "#/components/schemas/Ingress"
        workloads:
          type: array
          items:
            $ref: "#/components/schemas/Workload"
        releases:
          type: array
          items:
            $ref: "#/components/schemas/HelmRelease"
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        namespaces:
          type: array
          items:
            $ref: "#/components/schemas/Namespace"
        deployments:
          type: array
          items:
            $ref: "#/components/schemas/Deployment"
        pods:
          type: array
          items:
            $ref: "#/components/schemas/Pod"

    CreateDeploymentRequest:
      type: object
      required: [ns, name, image, replicas]
      properties:
        ns:
          type: string
        name:
          type: string
        image:
          type: string
        replicas:
          type: integer
          minimum: 0
        port:
          type: integer
          description: Container port to expose, optional.
        mapPos:
          $ref: "#/components/schemas/MapPos"
        cpuRequest:
          type: string
          description: CPU request per pod (e.g. "50m"). Defaults to 50m; this is the unit's power drain.
        memRequest:
          type: string
          description: Memory request per pod (e.g. "64Mi"). Defaults to 64Mi.
        labels:
          type: object
          description: Extra labels on the pod template (the ensign painted on new ships) besides app=<name>.
          additionalProperties:
            type: string
        terminationGracePeriodSeconds:
          type: integer
          description: Seconds a ship gets to stop after SIGTERM before it is killed; default 30.
        cpuLimit:
          type: string
          description: CPU limit per pod (e.g. "200m"); empty for none.
        memLimit:
          type: string
          description: Memory limit per pod (e.g. "128Mi"); empty for none.
        orders:
          type: array
          description: ConfigMaps and Secrets injected as environment (envFrom).
          items:
            $ref: "#/components/schemas/OrdersRef"
        readinessPath:
          type: string
          description: HTTP GET readiness probe path on the container port (a lookout); empty for none.
        livenessPath:
          type: string
          description: HTTP GET liveness probe path on the container port (a lookout); empty for none.

    OrdersKind:
      type: string
      enum: [ConfigMap, Secret]

    OrdersRef:
      type: object
      required: [kind, name]
      properties:
        kind:
          $ref: "#/components/schemas/OrdersKind"
        name:
          type: string

    Orders:
      type: object
      description: A ConfigMap or Secret, keys only (Secret values never leave the backend).
      required: [ns, name, kind, keys]
      properties:
        ns:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/OrdersKind"
        keys:
          type: array
          items:
            type: string

    CreateOrdersRequest:
      type: object
      required: [ns, name, kind, data]
      properties:
        ns:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/OrdersKind"
        data:
          type: object
          additionalProperties:
            type: string

    CreateServiceRequest:
      type: object
      required: [ns, name, selector, port]
      properties:
        ns:
          type: string
        name:
          type: string
        selector:
          type: object
          description: Labels the ships must fly for the beam to reach them.
          additionalProperties:
            type: string
        port:
          type: integer
          description: Service port.
        targetPort:
          type: integer
          description: Container port; defaults to port.
        type:
          type: string
          description: ClusterIP (default), NodePort or LoadBalancer.

    CreateStatefulSetRequest:
      type: object
      required: [ns, name, image, replicas]
      properties:
        ns:
          type: string
        name:
          type: string
        image:
          type: string
        replicas:
          type: integer
          minimum: 0
        port:
          type: integer
        mapPos:
          $ref: "#/components/schemas/MapPos"
        cpuRequest:
          type: string
        memRequest:
          type: string
        storage:
          type: string
          description: Size of a persistent volume per tanker (e.g. "1Gi"); empty for none.
        mountPath:
          type: string
          description: Where the volume mounts; defaults to /data.
        storageClass:
          type: string

    CreateJobRequest:
      type: object
      required: [ns, name, image]
      properties:
        ns:
          type: string
        name:
          type: string
        image:
          type: string
        command:
          type: array
          items:
            type: string
          description: Container command (entrypoint); empty keeps the image's.
        args:
          type: array
          items:
            type: string
        completions:
          type: integer
          minimum: 1
          description: Catches to land; defaults to 1.
        parallelism:
          type: integer
          minimum: 1
          description: Boats at sea at once; defaults to 1.
        backoffLimit:
          type: integer
          minimum: 0
          description: Retries before the catch is lost; defaults to 3.
        restartPolicy:
          type: string
          enum: [Never, OnFailure]
        ttlSeconds:
          type: integer
          minimum: 0
          description: Scrap the fleet this long after it finishes; omit to keep it.
        cpuRequest:
          type: string
        memRequest:
          type: string

    CreateIngressRequest:
      type: object
      required: [ns, name, service, port]
      properties:
        ns:
          type: string
        name:
          type: string
        host:
          type: string
          description: Empty matches any host.
        path:
          type: string
          description: Defaults to "/".
        service:
          type: string
          description: Backend Service name (a lighthouse in the same namespace).
        port:
          type: string
          description: Service port number or name.
        class:
          type: string
          description: IngressClass name, optional.
        tls:
          type: boolean
        tlsSecret:
          type: string
          description: TLS secret name, optional even when tls is true.

    ObjectPapers:
      type: object
      required: [kind, ns, name, metadata, spec, status, managers]
      properties:
        kind:
          type: string
        ns:
          type: string
        name:
          type: string
        metadata:
          type: string
          description: YAML of labels, annotations and ownerReferences (managedFields stripped).
        spec:
          type: string
          description: YAML of spec (data for ConfigMaps; empty for Pods' sensitive kinds).
        status:
          type: string
          description: YAML of status.
        managers:
          type: array
          description: Field managers that wrote this object, most recent last (from managedFields).
          items:
            type: string

    ApplyRequest:
      type: object
      required: [manifest]
      properties:
        manifest:
          type: string
          description: One or more YAML documents.
        dryRun:
          type: boolean

    ApplyResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ApplyItem"

    ApplyItem:
      type: object
      required: [kind, ns, name, action]
      properties:
        kind:
          type: string
        ns:
          type: string
        name:
          type: string
        action:
          type: string
          enum: [created, configured, unchanged]
        diff:
          type: string
          description: Lines of spec that change ("- old" / "+ new"), empty when unchanged.

    SelectorPatch:
      type: object
      required: [selector]
      properties:
        selector:
          type: object
          additionalProperties:
            type: string

    LabelPatch:
      type: object
      properties:
        set:
          type: object
          additionalProperties:
            type: string
        remove:
          type: array
          items:
            type: string

    Campaign:
      type: object
      description: An expedition, data not code; see PLAN-CAMPAIGN.md section 6.
      required: [id, title, levels]
      properties:
        id:
          type: string
        title:
          type: string
        tagline:
          type: string
        source:
          type: string
          description: URL of the vendor guide the expedition follows.
        builtin:
          type: boolean
          description: Shipped inside the binary (as opposed to ~/.config/harbor/campaigns).
        levels:
          type: array
          items:
            $ref: "#/components/schemas/CampaignLevel"

    CampaignLevel:
      type: object
      required: [id, title, steps]
      properties:
        id:
          type: string
        title:
          type: string
        concept:
          type: string
        par:
          type: integer
          description: Par time in seconds.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/CampaignStep"
        summary:
          $ref: "#/components/schemas/CampaignSummary"

    CampaignStep:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [instruct, check, form, values, helm-install, helm-upgrade, wait]
        title:
          type: string
        text:
          type: string
        hint:
          type: string
        probe:
          type: string
          description: "check: a whitelisted probe name."
        args:
          type: object
          additionalProperties:
            type: string
        form:
          type: string
          description: "form: shipyard, lighthouse, gate, orders, fleet or refit."
        prefill:
          type: object
          additionalProperties: true
        chart:
          type: string
          description: "values / helm-install: repo/name."
        release:
          type: string
        ns:
          type: string
        version:
          type: string
        required:
          type: array
          description: "values: keys the learner must set."
          items:
            type: string
        goal:
          $ref: "#/components/schemas/CampaignGoal"

    CampaignGoal:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [namespace-exists, orders-exist, deployment-ready, release-deployed, release-revision, ingress-exists, service-exists]
        ns:
          type: string
        name:
          type: string
        orders:
          type: string
          description: "orders-exist: ConfigMap or Secret."
        min:
          type: integer

    CampaignSummary:
      type: object
      properties:
        naval:
          type: string
        kubernetes:
          type: string
        practice:
          type: string
        kubectl:
          type: string

    ProbeRequest:
      type: object
      required: [probe]
      properties:
        probe:
          type: string
        args:
          type: object
          additionalProperties:
            type: string

    ProbeResult:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string

    StageRequest:
      type: object
      properties:
        ns:
          type: string
          description: Academy namespace (created with the academy label by "found"; required by every incident but cleanup).
        name:
          type: string
          description: Pod or Deployment name, depending on the incident.
        image:
          type: string
          description: Image for a lone ship; defaults to nginx:1.27-alpine.
        node:
          type: string
          description: Node to drain or uncordon (drain evicts the academy namespace's pods only).

    StageResult:
      type: object
      required: [incident, message]
      properties:
        incident:
          type: string
        message:
          type: string
          description: What was done, in harbor words.
        name:
          type: string
          description: The object the incident touched, if any.

    RefitRequest:
      type: object
      required: [image]
      properties:
        image:
          type: string
          description: New image for the first container.
        maxUnavailable:
          type: string
          description: RollingUpdate maxUnavailable (count or percent), optional.
        maxSurge:
          type: string
          description: RollingUpdate maxSurge (count or percent), optional.

    CreateNamespaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    ScaleRequest:
      type: object
      required: [replicas]
      properties:
        replicas:
          type: integer
          minimum: 0
        retireFirst:
          type: array
          description: >
            Pod names to retire first when scaling down ("sell this unit").
            Implemented with the controller.kubernetes.io/pod-deletion-cost
            annotation, so the ReplicaSet removes these before any others.
          items:
            type: string

    LevelProgress:
      type: object
      required: [stars]
      properties:
        stars:
          type: integer
          minimum: 0
          maximum: 3
        bestSeconds:
          type: number
          format: double
        hintsUsed:
          type: integer
        completedAt:
          type: string
          format: date-time

    Progress:
      type: object
      required: [levels]
      properties:
        levels:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/LevelProgress"

    HelmRepo:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
        url:
          type: string

    HelmChart:
      type: object
      required: [repo, name, version, description]
      properties:
        repo:
          type: string
        name:
          type: string
        version:
          type: string
        appVersion:
          type: string
        description:
          type: string

    HelmValues:
      type: object
      required: [chart, version, values]
      properties:
        chart:
          type: string
        version:
          type: string
        values:
          type: string
          description: values.yaml text.

    HelmRelease:
      type: object
      description: >
        A release as seen live from its storage secret (ns, name, revision,
        status) and, when listed through Helm, its chart details.
      required: [ns, name, revision, status]
      properties:
        ns:
          type: string
        name:
          type: string
        revision:
          type: integer
        status:
          type: string
          description: deployed, failed, pending-install, superseded, uninstalling, ...
        chart:
          type: string
        chartVersion:
          type: string
        appVersion:
          type: string
        updated:
          type: string
          format: date-time
        notes:
          type: string

    HelmRevision:
      type: object
      required: [revision, status, chart, updated, description]
      properties:
        revision:
          type: integer
        status:
          type: string
        chart:
          type: string
        updated:
          type: string
          format: date-time
        description:
          type: string

    HelmInstallRequest:
      type: object
      required: [ns, name, chart]
      properties:
        ns:
          type: string
        name:
          type: string
        chart:
          type: string
          description: repo/name
        version:
          type: string
        values:
          type: string
          description: values.yaml overrides.
        mapPos:
          $ref: "#/components/schemas/MapPos"

    HelmUpgradeRequest:
      type: object
      properties:
        chart:
          type: string
          description: repo/name; defaults to the release's current chart.
        version:
          type: string
        values:
          type: string

    HelmRollbackRequest:
      type: object
      required: [revision]
      properties:
        revision:
          type: integer
          minimum: 0
          description: 0 means the previous revision.

    WsMessage:
      type: object
      description: One message on the /ws event stream.
      required: [type, kind]
      properties:
        type:
          type: string
          enum: [snapshot, added, modified, deleted]
        kind:
          type: string
          enum: [Node, Namespace, Deployment, Workload, Pod, Service, Ingress, Event, HelmRelease, Snapshot]
        obj:
          description: Wire model of the given kind; a Snapshot when type is snapshot.
          oneOf:
            - $ref: "#/components/schemas/Node"
            - $ref: "#/components/schemas/Namespace"
            - $ref: "#/components/schemas/Deployment"
            - $ref: "#/components/schemas/Pod"
            - $ref: "#/components/schemas/Workload"
            - $ref: "#/components/schemas/Service"
            - $ref: "#/components/schemas/Ingress"
            - $ref: "#/components/schemas/Event"
            - $ref: "#/components/schemas/HelmRelease"
            - $ref: "#/components/schemas/Snapshot"
